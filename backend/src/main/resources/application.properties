server.port=${SERVER_PORT:8082}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/oopdex_db}
spring.datasource.username=${DB_USERNAME:oopdex_user}
spring.datasource.password=${DB_PASSWORD:oopdex@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Multipart & Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads

# JWT Security
jwt.secret=${JWT_SECRET:a-very-long-and-secure-random-string-for-jwt-secret-key}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Default Admin Configuration (Overrides on startup)
app.admin.username=${APP_ADMIN_USERNAME:oak}
app.admin.email=${APP_ADMIN_EMAIL:oak@pokemon.lab}
app.admin.password=${APP_ADMIN_PASSWORD:prof_oak_123}